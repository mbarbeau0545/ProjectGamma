; https://docs.platformio.org/page/projectconf.html

; resert CPU on debug 'monitor reset halt'

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube

board_build.cpu = cortex-m4
board_build.fpu = fpv4-sp-d16
board_build.float_abi = hard

build_flags =
    -Isrc/0_Common
    -Isrc/1_FMK
    -Isrc/2_DRV
    -Isrc/3_APP
;    -IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/DSP/Include
;    -LC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/DSP/Lib/GCC
;    -larm_cortexM4lf_math