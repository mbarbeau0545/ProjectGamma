; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
board_build.cpu = cortex-m4
board_build.fpu = fpv4-sp-d16
board_build.float_abi = hard
build_src_filter =
	+<*>
	-<4_PCSIM/**>
build_flags = 
	-Isrc/0_Common
	-Isrc/1_FMK
	-Isrc/2_DRV
	-Isrc/3_APP

[env:pc_sim_debug]
platform = native
build_type = debug
build_src_filter =
	+<0_Common/**>
	+<2_DRV/**>
	+<3_APP/**>
	+<4_PCSIM/**>
	-<3_APP/main.c>
build_flags =
	-DSTM32G474xx
	-Isrc/0_Common
	-Isrc/1_FMK
	-Isrc/2_DRV
	-Isrc/3_APP
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/STM32G4xx_HAL_Driver/Inc
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/Device/ST/STM32G4xx/Include
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/Include
	-lws2_32
debug_build_flags =
	-O0
	-g3
build_unflags =
	-std=gnu++11

[env:pioTest]
platform = native
test_build_src = no
build_flags =
	-DSTM32G474xx
	-Isrc/0_Common
	-Isrc/1_FMK
	-Isrc/2_DRV
	-Isrc/3_APP
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/STM32G4xx_HAL_Driver/Inc
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/Device/ST/STM32G4xx/Include
	-IC:/Users/mbarb/.platformio/packages/framework-stm32cubeg4/Drivers/CMSIS/Include
test_filter = test_APPLGC
